# Single-command dev environment: `docker compose up --build` starts
# Postgres, Qdrant, the FastAPI backend, and the Next.js frontend, all
# wired together on one Docker network. See README.md "Running with
# Docker" for the full walkthrough.
#
# This project does not use Supabase - Postgres here is a plain local
# container (see backend/app/config.py's DATABASE_URL), so it's provided
# directly rather than treated as an external managed service.

services:
  postgres:
    image: postgres:16
    container_name: product_matching_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-product_matching}
    ports:
      # HOST port 5433, container port 5432.
      #
      # This machine already runs a NATIVE Windows PostgreSQL 18 on 5432
      # (the one pgAdmin4 shows, holding OOP / teacher_survey_mvp). Two
      # servers cannot share a port: mapping "5432:5432" makes Docker fail
      # to publish with "Ports are not available", the postgres container
      # never becomes healthy, and because the backend has
      # `depends_on: postgres: condition: service_healthy` it then never
      # starts at all - which shows up in the browser as "Failed to fetch"
      # while the frontend itself looks fine.
      #
      # The INTERNAL port stays 5432, so the backend's
      # DATABASE_URL (@postgres:5432) is unchanged.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - product_matching_net

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: product_matching_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - product_matching_net
    # No healthcheck here: Qdrant's image doesn't ship curl/wget to probe
    # its own HTTP port with, and the backend already tolerates Qdrant not
    # being ready yet (see app/main.py's _rebuild_index_if_master_catalog_exists,
    # which catches and logs rather than crashing). depends_on below just
    # waits for the container process to start, not for readiness.

  backend:
    build:
      context: ./backend
    container_name: product_matching_backend
    env_file:
      - ./backend/.env
    environment:
      # Force container-network URLs regardless of what backend/.env has
      # for local (non-Docker) development - these two always need to
      # point at the Docker service names, not localhost/sqlite.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-product_matching}
      QDRANT_URL: http://qdrant:6333
      # Without this, Python buffers stdout when it isn't attached to a
      # real terminal (which `docker logs` never is) - every plain
      # print() in this codebase (entrypoint.sh's migration output,
      # main.py's startup prints, the [llm_auto_match] debug lines, etc.)
      # can sit in that buffer and never appear, or appear far later than
      # it actually ran, while stderr-based output (uvicorn's own logging,
      # Python's warnings module) shows up immediately regardless. This
      # was actively misleading a live debugging session (HANDOFF.md
      # section 14.0) - the absence of an expected print line was read as
      # "hasn't reached that code yet" when it may have already run.
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - product_matching_net

  frontend:
    build:
      context: ./frontend
    container_name: product_matching_frontend
    environment:
      # The browser runs on the host, outside the Docker network, so this
      # must be the externally-reachable backend URL (localhost:8000 via
      # the port mapping above) - never the internal service name
      # "backend" (that would only resolve inside the Docker network,
      # not from the user's browser).
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - product_matching_net

networks:
  product_matching_net:
    driver: bridge

volumes:
  pgdata:
  qdrant_data:
  frontend_node_modules:
  frontend_next_cache:
